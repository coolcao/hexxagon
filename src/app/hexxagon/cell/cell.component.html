<div
  *ngIf="cell"
  (click)="click()"
  class="flex h-full w-full items-center justify-center text-xl text-white dark:text-gray-800"
  [class.cursor-pointer]="showPointer()"
  [class.cursor-default]="!showPointer()"
  [ngClass]="getBgClass()"
>
  <app-player-cell [id]="cell.id" [player]="cell.color"></app-player-cell>
</div>
