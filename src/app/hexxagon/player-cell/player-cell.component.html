<span
  class="no-select flex h-full w-full items-center justify-center bg-transparent"
  [@showBall]="
    player == CellColor.RED
      ? 'red'
      : player == CellColor.BLUE
        ? 'blue'
        : 'hidden'
  "
  [ngClass]="{
    'red-ball': player == CellColor.RED,
    'blue-ball': player == CellColor.BLUE,
  }"
>
</span>
