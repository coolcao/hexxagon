<div
  class="flex min-h-screen items-center justify-center bg-gradient-to-br from-blue-50 to-green-50 p-4 dark:from-gray-800 dark:to-gray-900"
>
  <!-- 主卡片容器 -->
  <div
    class="w-full max-w-4xl overflow-hidden rounded-2xl bg-white shadow-xl transition-all duration-300 dark:bg-gray-700"
  >
    <!-- 标题区 -->
    <div class="bg-gradient-to-r from-green-400 to-blue-400 p-8 text-center">
      <h1 class="text-4xl font-bold text-white drop-shadow-md">HEXXAGON</h1>
      <p class="mt-2 font-medium text-blue-100">双人对战跳棋游戏</p>
    </div>

    <!-- 内容区 -->
    <div class="space-y-8 p-8">
      <!-- 玩法说明 -->
      <div class="space-y-4 text-gray-600 dark:text-gray-300">
        <h2 class="text-2xl font-semibold text-gray-800 dark:text-white">
          游戏规则
        </h2>
        <ul class="space-y-3 text-lg leading-relaxed">
          <li class="flex items-start">
            <span class="mr-2 text-green-500">•</span>
            双人联网对战，轮流操作己方棋子
          </li>
          <li class="flex items-start">
            <span class="mr-2 text-green-500">•</span>
            通过跳跃移动并收编对方棋子
          </li>
          <li class="flex items-start">
            <span class="mr-2 text-green-500">•</span>
            最终棋子多者获胜
          </li>
        </ul>
      </div>

      <!-- 操作按钮 -->
      <div class="flex flex-col justify-center gap-6 sm:flex-row">
        <button
          (click)="createRoom()"
          class="rounded-lg bg-gradient-to-r from-green-400 to-blue-400 px-8 py-4 text-lg font-semibold text-white shadow-md transition-all hover:from-green-500 hover:to-blue-500 hover:shadow-lg"
        >
          创建房间
        </button>
        <button
          (click)="showJoin = true"
          class="rounded-lg border-2 border-green-400 px-8 py-4 text-lg font-semibold text-green-600 transition-all hover:bg-green-50 dark:hover:bg-gray-600"
        >
          加入房间
        </button>
      </div>
    </div>
  </div>

  <!-- 加入房间模态框 -->
  <div
    class="bg-opacity-30 fixed inset-0 flex items-center justify-center bg-black p-4 backdrop-blur-sm"
    *ngIf="showJoin"
  >
    <div
      class="w-full max-w-md space-y-6 rounded-xl bg-white p-6 shadow-2xl dark:bg-gray-700"
    >
      <div class="flex items-center justify-between">
        <h3 class="text-2xl font-bold text-gray-800 dark:text-white">
          加入房间
        </h3>
        <button
          (click)="showJoin = false"
          class="text-2xl text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
        >
          &times;
        </button>
      </div>

      <input
        type="text"
        [(ngModel)]="peerId"
        placeholder="输入房间ID"
        class="w-full rounded-lg border-2 border-gray-200 px-4 py-3 transition-all focus:border-green-400 focus:ring-2 focus:ring-green-200 dark:border-gray-600 dark:bg-gray-800 dark:text-white"
      />

      <button
        (click)="joinRoom()"
        class="w-full rounded-lg bg-green-400 py-3 text-lg font-semibold text-white shadow-md transition-all hover:bg-green-500 hover:shadow-lg"
      >
        立即加入
      </button>
    </div>
  </div>
</div>
