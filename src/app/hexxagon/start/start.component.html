<div class="flex h-full w-full items-center justify-center bg-gray-300 dark:bg-gray-600">
  <div class="h-2/3 min-h-[600px] w-2/3 min-w-[800px] rounded-2xl bg-gray-200 dark:bg-gray-800">
    <div class="flex w-full justify-center p-10 text-3xl text-gray-600 dark:text-gray-200">
      Hexxagon跳跳棋
    </div>
    <div class="flex w-full justify-center">
      <div class="text-gray-600 dark:text-gray-200">
        <h1 class="text-3xl font-bold">玩法说明</h1>
        <p class="mt-2">1. 此游戏为联网双人游戏。</p>
        <p class="mt-2">
          2. 可创建房间，并邀请好友加入。也可通过好友的房间号加入房间。
        </p>
        <p class="mt-2">3. 双方各执一颜色棋子，轮流选择棋子并跳跃。</p>
        <p class="mt-2">
          4.
          跳跃时，可以跳到相邻位置，也可以跳过其他棋子，跳过其他棋子时，该棋子便被收编为自己的棋子。
        </p>
        <p class="mt-2">5. 最终棋盘上剩余棋子最多的一方获胜。</p>
      </div>
    </div>
    <div class="my-10 flex w-full items-center justify-center p-10 text-gray-600 dark:text-gray-200">
      <div class="relative ml-10 flex h-30 w-2/3 items-center justify-center rounded-xl select-none">
        <button (click)="createRoom()" type="button"
          class="mx-10 me-2 mt-5 mb-2 cursor-pointer rounded-lg bg-green-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-green-800 focus:ring-4 focus:ring-green-300 focus:outline-none disabled:cursor-not-allowed dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
          创建房间
        </button>
        <button (click)="showJoin = true" type="button"
          class="mx-10 me-2 mt-5 mb-2 cursor-pointer rounded-lg bg-green-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-green-800 focus:ring-4 focus:ring-green-300 focus:outline-none dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
          加入房间
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 加入房间 -->
<div class="fixed inset-0 z-10 flex h-full w-full flex-col items-center justify-center backdrop-blur-2xl"
  *ngIf="showJoin">
  <div class="relative w-1/3 rounded-2xl bg-gray-100 px-10 pt-10 dark:bg-gray-500">
    <button (click)="showJoin = false"
      class="absolute top-3 right-4 cursor-pointer text-2xl text-gray-400 dark:text-gray-300">
      ✕
    </button>
    <label for="peerId" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">房间ID</label>
    <input type="text" id="peerId"
      class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
      placeholder="请输入对方的房间ID" [(ngModel)]="peerId" required />

    <div class="my-10 flex w-full items-center justify-center">
      <button (click)="joinRoom()" type="button"
        class="mx-10 me-2 mt-5 mb-2 cursor-pointer rounded-lg bg-green-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-green-800 focus:ring-4 focus:ring-green-300 focus:outline-none dark:bg-green-600 dark:hover:bg-green-700 dark:focus:ring-green-800">
        加入房间
      </button>
    </div>
  </div>
</div>
